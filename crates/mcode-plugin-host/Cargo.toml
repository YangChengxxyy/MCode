[package]
name = "mcode-plugin-host"
description = "Bounded Wasmtime preflight and Host-only plugin substrates"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
mcode-config = { path = "../mcode-config" }
mcode-plugin-api = { path = "../mcode-plugin-api" }
sha2.workspace = true
thiserror.workspace = true
wasmparser = "=0.254.0"
wasmtime = { workspace = true, features = ["threads"] }

[build-dependencies]
wit-component = { version = "=0.254.0", features = ["dummy-module"] }
wit-parser = "=0.254.0"

[dev-dependencies]
serde.workspace = true
tokio.workspace = true
wasm-encoder = "=0.254.0"
wat.workspace = true
wit-component = { version = "=0.254.0", features = ["dummy-module"] }
wit-parser = "=0.254.0"
