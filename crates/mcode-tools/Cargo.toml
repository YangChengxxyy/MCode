[package]
name = "mcode-tools"
description = "MCode tool trait, registry, permission engine, and builtin tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mcode-core = { path = "../mcode-core" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "io-util"] }
async-trait.workspace = true
schemars.workspace = true
tokio-util.workspace = true
regex.workspace = true
globset.workspace = true
ignore.workspace = true
jsonschema.workspace = true

# Unix-only: SIGKILL the platform shell's process group on timeout/cancel.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
fs2.workspace = true
reqwest.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
tempfile.workspace = true
