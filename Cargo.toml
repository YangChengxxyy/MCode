[workspace]
resolver = "3"
members = [
    "crates/mcode-core",
    "crates/mcode-llm",
    "crates/mcode-tools",
    "crates/mcode-agent",
    "crates/mcode-session",
    "crates/mcode-cli",
    "crates/mcode",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

# Single source of truth for shared dependency versions.
# Crates opt in via `dep.workspace = true` and may add features locally.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = "0.1"
schemars = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.9"
regex = "1"
globset = "0.4"
ignore = "0.4"
jsonschema = "0.51"
tempfile = "3"
libc = "0.2"
windows-sys = "0.61"
sha2 = "0.10"
fs2 = "0.4"
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4", features = ["derive", "env"] }
assert_cmd = "2"
predicates = "3"
